<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Obrigado! | Youropa</title>
    <meta name="robots" content="noindex" />
    <link
      rel="preload"
      href="assets/fonts/gambarino.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="assets/fonts/bespoke.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Gambarino";
        src: url(assets/fonts/gambarino.woff2) format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Bespoke";
        src: url(assets/fonts/bespoke.woff2) format("woff2");
        font-display: swap;
      }
      :root {
        --navy: #16152b;
        --navy2: #2c2a4a;
        --gold: #e2bd7a;
        --cream: #e2dacb;
        --cream2: #f4efe6;
        --line: #44425c;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Bespoke", Georgia, serif;
        background: var(--cream2);
        color: var(--navy);
        line-height: 1.7;
        font-size: 17px;
      }
      h1,
      h2,
      h3,
      .price {
        font-family: "Gambarino", Georgia, serif;
        font-weight: 400;
      }
      a {
        color: inherit;
      }
      .wrap {
        max-width: 1080px;
        margin: 0 auto;
        padding: 0 24px;
      }
      header {
        background: var(--navy);
        padding: 18px 0;
      }
      header .wrap {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header img {
        height: 22px;
        display: block;
      }
      .logolink {
        display: inline-block;
        line-height: 0;
      }
      .lang {
        color: var(--cream);
        text-decoration: none;
        font-size: 14px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 1px solid var(--line);
        padding: 6px 14px;
        border-radius: 999px;
      }
      .hero {
        background: var(--cream2);
        padding: 28px 0 64px;
      }
      .herowrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 24px;
        position: relative;
      }
      .herocard {
        position: relative;
        background: var(--navy);
        color: #fff;
        max-width: 560px;
        margin: -150px 0 0 56px;
        padding: 46px 48px 50px;
        box-shadow: 0 30px 70px rgba(22, 21, 43, 0.28);
      }
      .herocard::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(226, 189, 122, 0.28);
        pointer-events: none;
      }
      .band {
        margin: 0;
        position: relative;
      }
      .band img {
        width: 100%;
        height: auto;
        display: block;
      }
      .band figcaption {
        background: var(--navy);
        color: var(--cream);
        font-size: 14px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 12px 24px;
        text-align: center;
      }
      .tag {
        display: block;
        color: var(--gold);
        font-size: 12.5px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        margin-bottom: 22px;
      }
      .herocard h1 {
        font-size: clamp(28px, 3.4vw, 42px);
        line-height: 1.12;
        margin-bottom: 18px;
      }
      .herocard p {
        color: var(--cream);
        font-size: 18px;
        margin-bottom: 30px;
        line-height: 1.55;
      }
      .btn {
        display: inline-block;
        background: var(--gold);
        color: var(--navy);
        padding: 15px 34px;
        border-radius: 2px;
        text-decoration: none;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 0;
        cursor: pointer;
        font-family: "Bespoke", serif;
      }
      .btn:hover {
        filter: brightness(1.06);
      }
      section {
        padding: 96px 0;
      }
      h2 {
        font-size: clamp(32px, 4.4vw, 48px);
        line-height: 1.12;
        letter-spacing: 0.005em;
        margin-bottom: 14px;
      }
      .note {
        color: #5b5974;
        margin-bottom: 34px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 32px;
      }
      .card {
        background: #fbf9f4;
        border: 1px solid #ebe3d3;
        display: flex;
        flex-direction: column;
      }
      .ph {
        aspect-ratio: 4/3;
        background: linear-gradient(135deg, var(--navy2), var(--navy));
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--gold);
        font-family: "Gambarino", serif;
        font-size: 56px;
        overflow: hidden;
      }
      .ph img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card .body {
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
      }
      .card .type {
        color: #8a87a3;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        font-size: 12px;
        display: block;
        padding: 0 0 4px;
      }
      .card h3 {
        font-size: 24px;
        line-height: 1.2;
        margin-bottom: 6px;
      }
      .card p {
        color: #5b5974;
        font-size: 15px;
        flex: 1;
      }
      .price {
        font-size: 30px;
        margin-top: auto;
        padding-top: 6px;
      }
      .price small {
        font-size: 15px;
        font-family: "Bespoke", serif;
        color: #5b5974;
      }
      .card .btn {
        text-align: center;
        padding: 12px 18px;
      }
      .why {
        background: var(--navy);
        color: #fff;
      }
      .why h2 {
        color: #fff;
      }
      .whys {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 28px 40px;
        margin-top: 30px;
      }
      .whys div {
        border-top: 1px solid var(--line);
        padding-top: 18px;
      }
      .whys h3 {
        color: var(--gold);
        font-size: 22px;
        margin-bottom: 6px;
      }
      .whys p {
        color: var(--cream);
        font-size: 16px;
      }
      .steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 32px;
        margin-top: 34px;
      }
      .step {
        border: 1px solid #ebe3d3;
        background: #fbf9f4;
        padding: 32px 28px;
      }
      .step b {
        font-family: "Gambarino", serif;
        font-weight: 400;
        font-size: 36px;
        color: #9a97b3;
        display: block;
        margin-bottom: 6px;
      }
      .plans h3 {
        font-size: 22px;
        margin: 34px 0 14px;
      }
      .tabs {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin: 26px 0 22px;
      }
      .tab {
        font: inherit;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 12px 26px;
        border: 1px solid var(--navy);
        background: transparent;
        color: var(--navy);
        cursor: pointer;
      }
      .tab[aria-selected="true"] {
        background: var(--navy);
        color: #fff;
      }
      .panel {
        display: none;
        grid-template-columns: 1.25fr 1fr;
        gap: 36px;
        align-items: start;
      }
      .panel.on {
        display: grid;
      }
      .panel .pl {
        align-items: flex-start;
      }
      .info {
        border-top: 1px solid var(--line);
        padding-top: 6px;
      }
      .info div {
        display: grid;
        grid-template-columns: minmax(120px, 170px) 1fr;
        gap: 14px;
        padding: 14px 0;
        border-bottom: 1px solid #ebe3d3;
        font-size: 16px;
      }
      .info b {
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 13px;
        color: #5b5974;
        padding-top: 3px;
        overflow-wrap: anywhere;
      }
      .mapfig {
        margin: 0;
        position: relative;
        background: var(--navy);
      }
      .mapbox {
        position: relative;
        height: clamp(320px, 45vw, 520px);
      }
      .mapbox iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        filter: grayscale(0.55) sepia(0.25) saturate(0.8) contrast(1.02);
      }
      .pin {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -100%);
        pointer-events: none;
        text-align: center;
      }
      .pin i {
        display: block;
        width: 26px;
        height: 26px;
        margin: 0 auto;
        background: var(--gold);
        border: 3px solid var(--navy);
        border-radius: 50% 50% 50% 0;
        transform: rotate(-45deg);
        box-shadow: 0 6px 14px rgba(22, 21, 43, 0.35);
      }
      .pin span {
        display: block;
        margin: 6px auto 0;
        background: var(--navy);
        color: #fff;
        font-size: 13px;
        letter-spacing: 0.06em;
        padding: 6px 12px;
        white-space: nowrap;
      }
      .mapfig figcaption {
        background: var(--navy);
        color: var(--cream);
        font-size: 14px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        padding: 12px 24px;
        text-align: center;
      }
      .dist {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }
      .dist span {
        border: 1px solid var(--line);
        padding: 7px 14px;
        font-size: 14px;
        color: var(--cream);
      }
      .dist em {
        font-style: normal;
        color: var(--gold);
        margin-left: 6px;
      }
      @media (max-width: 820px) {
        .panel.on {
          grid-template-columns: 1fr;
        }
        .whys {
          grid-template-columns: 1fr;
        }
      }
      .pl {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        align-items: flex-end;
      }
      .pl figure {
        background: #fbf9f4;
        border: 1px solid #ebe3d3;
        padding: 12px;
        flex: 1 1 200px;
        max-width: 340px;
      }
      .pl img {
        width: 100%;
        height: auto;
        display: block;
      }
      .pl figcaption {
        font-size: 13px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #5b5974;
        margin-top: 8px;
        text-align: center;
      }
      .formsec {
        background: #fbf9f4;
        border-top: 1px solid #ebe3d3;
      }
      form {
        max-width: 640px;
        margin-top: 26px;
        display: grid;
        gap: 16px;
      }
      label {
        display: block;
        font-size: 14px;
        letter-spacing: 0.06em;
        color: #5b5974;
        margin-bottom: 6px;
      }
      input,
      select {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid #ddd5c4;
        background: #f7f3ea;
        font-family: "Bespoke", serif;
        font-size: 16px;
        color: var(--navy);
        border-radius: 2px;
      }
      input:focus,
      select:focus {
        outline: 2px solid var(--gold);
        border-color: var(--gold);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .chk {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        font-size: 14px;
        color: #5b5974;
      }
      .chk input {
        width: auto;
        margin-top: 5px;
      }
      .ok {
        display: none;
        background: var(--navy);
        color: var(--cream);
        padding: 20px;
        margin-top: 20px;
        max-width: 640px;
      }
      @media (max-width: 820px) {
        section {
          padding: 64px 0;
        }
        .cards,
        .steps {
          gap: 24px;
        }
        .hero {
          padding: 0 0 40px;
        }
        .herowrap {
          padding: 0;
        }
        .herophoto {
          height: 350px;
        }
        .herocard {
          margin: -44px 16px 0 16px;
          padding: 34px 26px 38px;
        }
        .cards,
        .steps,
        .whys,
        .row {
          grid-template-columns: 1fr;
        }
        section {
          padding: 52px 0;
        }
      }

      .ty {
        flex: 1;
        display: flex;
        align-items: center;
        background: var(--cream2);
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .ty .box {
        max-width: 620px;
        margin: 0 auto;
        text-align: center;
        padding: 80px 24px;
      }
      .ty h1 {
        font-size: clamp(36px, 6vw, 56px);
        margin-bottom: 18px;
      }
      .ty p {
        color: #5b5974;
        font-size: 19px;
        margin-bottom: 34px;
      }

      /* ---------- Rodapé ---------- */
      .sitefoot {
        background: var(--navy);
        color: var(--cream);
        padding: 72px 0 32px;
        font-size: 15px;
        text-align: center;
      }
      .sitefoot a {
        color: var(--cream);
        text-decoration: none;
        transition: color 0.2s;
      }
      .sitefoot a:hover {
        color: var(--gold);
      }
      .sitefoot .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sf-logo {
        display: inline-block;
        line-height: 0;
        margin-bottom: 28px;
      }
      .sf-logo img {
        height: 34px;
        width: auto;
      }
      .sf-contact {
        font-style: normal;
        letter-spacing: 0.06em;
        line-height: 1.9;
        margin-bottom: 36px;
      }
      .sf-nav {
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px 40px;
        padding: 26px 0;
        border-top: 1px solid rgba(226, 218, 203, 0.15);
        border-bottom: 1px solid rgba(226, 218, 203, 0.15);
        font-size: 13px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      .sf-social {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px 32px;
        margin-top: 26px;
        font-size: 14px;
        letter-spacing: 0.08em;
      }
      .sf-bottom {
        width: 100%;
        margin-top: 44px;
        padding-top: 22px;
        border-top: 1px solid rgba(226, 218, 203, 0.15);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #a9a6bd;
      }
      .sf-bottom a {
        color: #a9a6bd;
      }
      @media (max-width: 820px) {
        .sitefoot {
          padding: 56px 0 28px;
        }
        .sf-nav {
          flex-direction: column;
          gap: 14px;
        }
      }
    </style>
    <!-- GOOGLE ADS CONVERSION TAG: Realeads will add the conversion/gtag snippet here. This page is the conversion page. -->
  </head>

      <div class="wrap">
        <a href="https://www.youropapt.com" style="display: inline-flex"
          ><img src="assets/img/logo.png" alt="Youropa"
        /></a>

  </body>
</html>
