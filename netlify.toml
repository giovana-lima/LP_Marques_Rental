[build]
  publish = "public"
  functions = "netlify/functions"

# rent-marques.youropapt.com -> página em inglês
[[redirects]]
  from = "https://rent-marques.youropapt.com/"
  to = "/rent-porto-en.html"
  status = 200
  force = true

# arrendar-marques.youropapt.com (e qualquer outro domínio) -> página em português
[[redirects]]
  from = "/"
  to = "/rent-porto-pt.html"
  status = 200
