<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel Marquês</title>
<link rel="icon" href="/assets/img/favicon.svg?v=3" type="image/svg+xml">
<style>
  :root {
    --navy: #16152b; --gold: #e2bd7a; --gold-ink: #86662b; --paper: #fbf9f4; --card: #fff;
    --ink: #16152b; --muted: #5b5974; --line: #e6e1d6; --ok: #1f7a4d; --ok-bg: #e5f3ec;
    --bad: #b3261e; --bad-bg: #fbe9e7; --warn: #8a5a00; --warn-bg: #fdf3dc; --info-bg: #eef0f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--navy); color: #fff; padding: 16px; }
  .hin { max-width: 1200px; margin: 0 auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 17px; font-weight: 600; margin: 0 auto 0 0; letter-spacing: .01em; }
  header h1 span { color: var(--gold); font-weight: 400; }
  main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  h2 { font-size: 16px; margin: 36px 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  button, select, input[type=password] { font: inherit; }
  button { cursor: pointer; border: 1px solid var(--navy); background: var(--navy); color: #fff; padding: 8px 14px; border-radius: 6px; }
  button.line { background: transparent; color: var(--navy); }
  header button.line { color: #fff; border-color: rgba(255,255,255,.5); }
  button:disabled { opacity: .5; cursor: default; }
  select { padding: 7px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.5); background: transparent; color: #fff; }
  select option { color: var(--ink); }
  .login { max-width: 360px; margin: 12vh auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
  .login h1 { font-size: 20px; margin: 0 0 6px; }
  .login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; margin: 14px 0 12px; }
  .login button { width: 100%; padding: 10px; }
  .err { color: var(--bad); font-size: 14px; min-height: 1.5em; }
  .banner { border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .banner p { margin: 0; flex: 1 1 320px; }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner.ok { background: var(--ok-bg); color: var(--ok); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .v { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; margin: 4px 0; }
  .kpi .l { font-size: 13px; color: var(--muted); }
  .kpi .s { font-size: 12px; color: var(--muted); }
  .kpi.bad .v { color: var(--bad); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; white-space: nowrap; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: #faf8f3; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .b-sent { background: var(--ok-bg); color: var(--ok); }
  .b-failed { background: var(--bad-bg); color: var(--bad); }
  .b-imported { background: var(--info-bg); color: var(--navy); }
  .errtxt { display: block; font-size: 12px; color: var(--bad); white-space: normal; max-width: 280px; }
  .bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .filters button { background: transparent; color: var(--muted); border-color: var(--line); }
  .filters button[aria-pressed=true] { background: var(--navy); color: #fff; border-color: var(--navy); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .grid2 .card { padding: 4px 0; }
  .grid2 h3 { font-size: 14px; margin: 10px 14px 4px; }
  .grid2 td:first-child { white-space: normal; }
  .lf { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .lf label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .lf select, .lf input { font: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; }
  .lcount { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; margin: 4px 0 10px; }
  .lcount b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .spark { display: inline-block; height: 8px; background: var(--gold); border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .help { font-size: 13px; color: var(--muted); max-width: 70ch; }
  .hidden { display: none !important; }
  input[type=checkbox] { width: 16px; height: 16px; }
  @media (max-width: 600px) { .kpi .v { font-size: 24px; } }
  .langs { display: inline-flex; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; overflow: hidden; }
  .langs button { border: 0; border-radius: 0; background: transparent; color: #fff; padding: 7px 10px; font-size: 13px; }
  .langs button[aria-pressed=true] { background: var(--gold); color: var(--navy); }
  .login .langs { border-color: var(--line); float: right; }
  .login .langs button { color: var(--muted); }
  .login .langs button[aria-pressed=true] { color: var(--navy); }
</style>
</head>
<body>

<section id="login" class="login">
  <div class="langs" role="group" aria-label="Language"><button data-lang="pt">PT</button><button data-lang="en">EN</button></div>
  <h1 data-t="title">Painel Marquês</h1>
  <p class="muted small" data-t="loginSub"></p>
  <form id="lf">
    <label for="pw" class="small" data-t="password"></label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" data-t="enter"></button>
    <p class="err" id="lerr"></p>
  </form>
</section>

<div id="app" class="hidden">
  <header>
    <div class="hin">
      <h1><b data-t="panel" style="font-weight:600"></b> <span>· Jardins do Marquês</span></h1>
      <select id="days" aria-label="Period">
        <option value="1" data-t="today"></option>
        <option value="7" data-t="d7" selected></option>
        <option value="30" data-t="d30"></option>
        <option value="90" data-t="d90"></option>
      </select>
      <button class="line" id="refresh" data-t="refresh"></button>
      <div class="langs" role="group" aria-label="Language"><button data-lang="pt">PT</button><button data-lang="en">EN</button></div>
      <button class="line" id="logout" data-t="logout"></button>
    </div>
  </header>
  <main>
    <div id="banners"></div>

    <div class="kpis" id="kpis"></div>
    <p class="help" id="updated"></p>

    <h2>Leads</h2>
    <div class="bar">
      <div class="filters bar" style="margin:0" id="filters">
        <button data-f="all" aria-pressed="true" data-t="fAll"></button>
        <button data-f="failed" aria-pressed="false" data-t="fFailed"></button>
        <button data-f="imported" aria-pressed="false" data-t="fImported"></button>
        <button data-f="sent" aria-pressed="false" data-t="fSent"></button>
      </div>
      <span style="flex:1"></span>
      <button id="resendSel" disabled></button>
      <label class="small" style="cursor:pointer"><input type="file" id="csv" accept=".csv,text/csv" class="hidden"><span style="display:inline-block;border:1px solid var(--navy);border-radius:6px;padding:8px 14px" data-t="importCsv"></span></label>
    </div>
    <div class="lf" id="lfilters">
      <label><span data-t="thCampaign"></span><select data-k="campaign"></select></label>
      <label>UTM Source<select data-k="utm_source"></select></label>
      <label>UTM Medium<select data-k="utm_medium"></select></label>
      <label>UTM Campaign<select data-k="utm_campaign"></select></label>
      <label>UTM Content<select data-k="utm_content"></select></label>
      <label>UTM Term<select data-k="utm_term"></select></label>
      <label><span data-t="thType"></span><select data-k="typology"></select></label>
      <label><span data-t="thLang"></span><select data-k="language"></select></label>
      <label><span data-t="from"></span><input type="date" id="lfFrom"></label>
      <label><span data-t="to"></span><input type="date" id="lfTo"></label>
    </div>
    <div class="lcount"><b id="lcN">0</b><span id="lcTxt" class="muted"></span><span style="flex:1"></span><button class="line small" id="lfClear" data-t="clear"></button><button class="line small" id="lfCsv" data-t="exportCsv"></button></div>
    <div class="card"><div class="tablewrap"><table>
      <thead><tr><th><input type="checkbox" id="all"></th><th data-t="thDate"></th><th data-t="thName"></th><th data-t="thContact"></th><th data-t="thType"></th><th data-t="thLang"></th><th data-t="thCampaign"></th><th>UTM Source</th><th>UTM Medium</th><th>UTM Campaign</th><th>UTM Content</th><th>UTM Term</th><th data-t="thInm"></th><th></th></tr></thead>
      <tbody id="leads"></tbody>
    </table></div></div>
    <p class="help" data-th="importHelp"></p>

    <h2 data-t="hDaily"></h2>
    <div class="card"><div class="tablewrap"><table>
      <thead><tr><th data-t="thDay"></th><th class="num" data-t="kVisits"></th><th class="num" data-t="kCta"></th><th class="num" data-t="kStart"></th><th class="num" data-t="kSent"></th><th class="num" data-t="thThanks"></th><th class="num" data-t="thLeads"></th><th class="num" data-t="thFailed"></th></tr></thead>
      <tbody id="daily"></tbody>
    </table></div></div>

    <h2 data-t="hClicks"></h2>
    <div class="grid2" id="breakdown"></div>
    <p class="help" data-t="anonHelp"></p>
  </main>
</div>

<script>
(function () {
  var I18N = {
    pt: {
      title: "Painel Marquês", panel: "Painel", loginSub: "Leads, envios para o Inmovilla e cliques das landing pages.",
      password: "Senha", enter: "Entrar", wrongPw: "Senha incorreta.", noPw: "A senha do painel (PAINEL_PASSWORD) não está configurada no Netlify.",
      loadErr: "Não foi possível carregar o painel: ",
      today: "Hoje", d7: "Últimos 7 dias", d30: "Últimos 30 dias", d90: "Últimos 90 dias", refresh: "Atualizar", logout: "Sair",
      fAll: "Todos", fFailed: "Falhados", fImported: "Importados", fSent: "Enviados",
      resendSel: "Reenviar selecionados", importCsv: "Importar CSV do Netlify",
      thDate: "Data", thName: "Nome", thContact: "Email / telefone", thType: "Tipologia", thLang: "Idioma", thSource: "Origem", thInm: "Envio Inmovilla", thCampaign: "Campanha", from: "De", to: "Até", clear: "Limpar filtros", exportCsv: "Exportar CSV", any: "Todos", empty: "(vazio)", leadsWord: function (n) { return n === 1 ? "lead" : "leads"; },
      importHelp: '"Importar CSV do Netlify" serve para recuperar leads antigos: no Netlify, abra Forms › lead › <b>Download as CSV</b> e escolha o ficheiro aqui. Os leads entram como "Importado" e só vão para o Inmovilla quando os selecionar e clicar em "Reenviar".',
      hDaily: "Atividade por dia", thDay: "Dia", thThanks: "Página de obrigado", thLeads: "Leads registados", thFailed: "Emails falhados",
      hClicks: "Detalhe dos cliques", anonHelp: "As visitas e os cliques são contados de forma anónima (sem cookies e sem dados pessoais). Os contadores começaram a 9 de novembro de 2026.",
      kVisits: "Visitas", kCta: 'Cliques "Saiba mais"', kStart: "Formulário começado", kSent: "Formulário enviado", kInm: "Enviados ao Inmovilla", kFail: "Envios falhados",
      ofVisits: "% das visitas", inPeriod: "leads registados neste período", seeBelow: "ver lista abaixo", none: "nenhum",
      failedBanner: function (n) { return n + (n > 1 ? " leads não chegaram" : " lead não chegou") + " ao Inmovilla."; }, lastErr: "Último erro: ", resendFailed: "Reenviar falhados",
      allOk: "Envios em dia.", lastSent: "Último lead enviado para o Inmovilla: ",
      importedBanner: function (n) { return n + " lead(s) importado(s) ainda não foram enviados para o Inmovilla."; },
      smtpIdle: "Ligação ao Gmail (conta que envia os leads): por testar.", smtpTest: "Testar ligação", smtpTesting: "A testar…",
      smtpOk: "<b>Ligação ao Gmail: OK.</b> Os leads novos vão ser enviados.", smtpBad: "<b>Ligação ao Gmail falhou:</b> ", smtpFix: ". Verifique a senha de app em SMTP_PASS no Netlify.",
      mismatch: function (a, b) { return "O site enviou " + a + " formulário(s) neste período, mas só " + b + " chegaram à função de envio. A diferença costuma ser formulários marcados como spam pelo Netlify (Forms › lead › Spam submissions)."; },
      updated: "Atualizado às ", noLeads: "Sem leads registados", inFilter: " neste filtro",
      sent: "Enviado", failed: "Falhou", imported: "Importado", resend: "Reenviar", select: "Selecionar", selectAll: "Selecionar todos",
      sending: "A enviar… ", resendDone: function (ok, fail, err) { return ok + " enviado(s) para o Inmovilla" + (fail ? ", " + fail + " falharam.\n" + err : "."); },
      error: "Erro: ", csvEmpty: "O ficheiro está vazio.", csvCols: "Não encontrei as colunas name / email no ficheiro.",
      csvConfirm: function (n) { return "Importar " + n + " lead(s)? Não são enviados para o Inmovilla até os reenviar."; },
      csvDone: function (a, s) { return a + " importado(s), " + s + " já existiam ou foram ignorados."; }, csvErr: "Erro na importação: ",
      bWhere: 'Onde clicaram em "Saiba mais"', bTabs: "Separadores das tipologias", bPlans: "Plantas abertas", bByType: "Formulários enviados por tipologia", bOther: "Outros", bSource: "Origem das visitas",
      wHeader: "Topo da página", wMenu: "Menu", wHero: "Início (hero)", wTab: "Separador ",
      oGallery: "Fotos da galeria abertas", oTel: "Cliques no telefone", oLang: "Mudança de idioma", oPhone: "Telefone inválido no formulário", oErr: "Erro ao enviar o formulário",
      sGoogle: "Google Ads", sExt: "Outros sites", sDirect: "Direto / sem origem", studio: "Estúdio", locale: "pt-PT"
    },
    en: {
      title: "Marquês Dashboard", panel: "Dashboard", loginSub: "Leads, delivery to Inmovilla and landing page clicks.",
      password: "Password", enter: "Sign in", wrongPw: "Wrong password.", noPw: "The dashboard password (PAINEL_PASSWORD) is not set in Netlify.",
      loadErr: "Could not load the dashboard: ",
      today: "Today", d7: "Last 7 days", d30: "Last 30 days", d90: "Last 90 days", refresh: "Refresh", logout: "Sign out",
      fAll: "All", fFailed: "Failed", fImported: "Imported", fSent: "Sent",
      resendSel: "Resend selected", importCsv: "Import CSV from Netlify",
      thDate: "Date", thName: "Name", thContact: "Email / phone", thType: "Type", thLang: "Language", thSource: "Source", thInm: "Sent to Inmovilla", thCampaign: "Campaign", from: "From", to: "To", clear: "Clear filters", exportCsv: "Export CSV", any: "All", empty: "(empty)", leadsWord: function (n) { return n === 1 ? "lead" : "leads"; },
      importHelp: '"Import CSV from Netlify" recovers older leads: in Netlify, open Forms › lead › <b>Download as CSV</b> and choose the file here. Leads come in as "Imported" and only go to Inmovilla when you select them and click "Resend".',
      hDaily: "Activity by day", thDay: "Day", thThanks: "Thank-you page", thLeads: "Leads recorded", thFailed: "Failed emails",
      hClicks: "Click details", anonHelp: "Visits and clicks are counted anonymously (no cookies, no personal data). Counting started on 9 November 2026.",
      kVisits: "Visits", kCta: '"Learn more" clicks', kStart: "Form started", kSent: "Form sent", kInm: "Sent to Inmovilla", kFail: "Failed deliveries",
      ofVisits: "% of visits", inPeriod: "leads recorded in this period", seeBelow: "see list below", none: "none",
      failedBanner: function (n) { return n + (n > 1 ? " leads did not reach" : " lead did not reach") + " Inmovilla."; }, lastErr: "Last error: ", resendFailed: "Resend failed",
      allOk: "Deliveries up to date.", lastSent: "Last lead sent to Inmovilla: ",
      importedBanner: function (n) { return n + " imported lead(s) have not been sent to Inmovilla yet."; },
      smtpIdle: "Gmail connection (account that sends the leads): not tested.", smtpTest: "Test connection", smtpTesting: "Testing…",
      smtpOk: "<b>Gmail connection: OK.</b> New leads will be sent.", smtpBad: "<b>Gmail connection failed:</b> ", smtpFix: ". Check the app password in SMTP_PASS in Netlify.",
      mismatch: function (a, b) { return "The site sent " + a + " form(s) in this period, but only " + b + " reached the sending function. The gap is usually forms flagged as spam by Netlify (Forms › lead › Spam submissions)."; },
      updated: "Updated at ", noLeads: "No leads recorded", inFilter: " for this filter",
      sent: "Sent", failed: "Failed", imported: "Imported", resend: "Resend", select: "Select", selectAll: "Select all",
      sending: "Sending… ", resendDone: function (ok, fail, err) { return ok + " sent to Inmovilla" + (fail ? ", " + fail + " failed.\n" + err : "."); },
      error: "Error: ", csvEmpty: "The file is empty.", csvCols: "Could not find the name / email columns in the file.",
      csvConfirm: function (n) { return "Import " + n + " lead(s)? They are not sent to Inmovilla until you resend them."; },
      csvDone: function (a, s) { return a + " imported, " + s + " already existed or were skipped."; }, csvErr: "Import error: ",
      bWhere: 'Where people clicked "Learn more"', bTabs: "Apartment type tabs", bPlans: "Floor plans opened", bByType: "Forms sent by type", bOther: "Other", bSource: "Visit sources",
      wHeader: "Top of page", wMenu: "Menu", wHero: "Hero", wTab: "Tab ",
      oGallery: "Gallery photos opened", oTel: "Phone clicks", oLang: "Language switch", oPhone: "Invalid phone in form", oErr: "Form sending error",
      sGoogle: "Google Ads", sExt: "Other sites", sDirect: "Direct / unknown", studio: "Studio", locale: "en-GB"
    }
  };
  var LANG = "pt";
  try { LANG = localStorage.getItem("painelLang") || ((navigator.language || "").indexOf("pt") === 0 ? "pt" : "en"); } catch (e) {}
  if (!I18N[LANG]) LANG = "pt";
  var t = function (k) { return I18N[LANG][k]; };

  var KEY = "";
  try { KEY = sessionStorage.getItem("painelKey") || ""; } catch (e) {}
  var data = null, filter = "all", selected = {};
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var fmt = function (iso) { try { return new Date(iso).toLocaleString(t("locale"), { timeZone: "Europe/Lisbon", day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } };
  var day = function (iso) { try { return new Date(iso).toLocaleDateString("sv-SE", { timeZone: "Europe/Lisbon" }); } catch (e) { return String(iso).slice(0, 10); } };

  function applyLang() {
    document.documentElement.lang = LANG === "pt" ? "pt-PT" : "en";
    document.title = t("title");
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = t(el.getAttribute("data-t")); });
    document.querySelectorAll("[data-th]").forEach(function (el) { el.innerHTML = t(el.getAttribute("data-th")); });
    document.querySelectorAll("[data-lang]").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-lang") === LANG ? "true" : "false"); });
    $("all").setAttribute("aria-label", t("selectAll"));
    updateSel();
    if (data) render();
  }
  document.querySelectorAll("[data-lang]").forEach(function (b) {
    b.addEventListener("click", function () { LANG = b.getAttribute("data-lang"); try { localStorage.setItem("painelLang", LANG); } catch (e) {} applyLang(); });
  });

  function api(method, body) {
    var url = "/api/painel" + (method === "GET" ? "?days=" + $("days").value : "");
    return fetch(url, { method: method, headers: { "x-painel-key": KEY, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw Object.assign(new Error(r.status === 401 ? t("wrongPw") : r.status === 503 ? t("noPw") : (j.error || ("HTTP " + r.status))), { status: r.status });
        return j; }); });
  }

  function showLogin(msg) { $("app").classList.add("hidden"); $("login").classList.remove("hidden"); $("lerr").textContent = msg || ""; }
  function load() {
    $("refresh").disabled = true;
    return api("GET").then(function (j) {
      data = j; $("login").classList.add("hidden"); $("app").classList.remove("hidden"); render();
    }).catch(function (e) {
      if (e.status === 401 || e.status === 503) { try { sessionStorage.removeItem("painelKey"); } catch (x) {} showLogin(e.message); }
      else alert(t("loadErr") + e.message);
    }).finally(function () { $("refresh").disabled = false; });
  }

  $("lf").addEventListener("submit", function (e) { e.preventDefault(); KEY = $("pw").value; try { sessionStorage.setItem("painelKey", KEY); } catch (x) {} load(); });
  $("logout").addEventListener("click", function () { KEY = ""; try { sessionStorage.removeItem("painelKey"); } catch (x) {} $("pw").value = ""; showLogin(""); });
  $("refresh").addEventListener("click", load);
  $("days").addEventListener("change", load);

  function sum(ev, lang, detail, days) {
    var n = 0;
    (days || data.events).forEach(function (d) {
      for (var k in d.counts) { var p = k.split("|"); if (p[0] === ev && (!lang || p[1] === lang) && (!detail || p[2] === detail)) n += d.counts[k]; }
    });
    return n;
  }
  function inPeriod(rec) { var first = data.events.length ? data.events[data.events.length - 1].day : ""; return day(rec.created_at) >= first; }

  function render() {
    var leads = data.leads, period = leads.filter(inPeriod);
    var failedAll = leads.filter(function (l) { return l.status === "failed"; });
    var importedAll = leads.filter(function (l) { return l.status === "imported"; });
    var sentP = period.filter(function (l) { return l.status === "sent"; }).length;
    var failedP = period.filter(function (l) { return l.status === "failed"; }).length;

    var b = "";
    if (failedAll.length) b += '<div class="banner bad"><p><b>' + t("failedBanner")(failedAll.length) + "</b> " + t("lastErr") + esc(failedAll[0].error || "") + '</p><button id="resendFailed">' + t("resendFailed") + "</button></div>";
    else if (leads.length) b += '<div class="banner ok"><p><b>' + t("allOk") + "</b> " + t("lastSent") + esc(fmt((leads.find(function (l) { return l.status === "sent"; }) || {}).created_at || "")) + "</p></div>";
    if (importedAll.length) b += '<div class="banner warn"><p>' + t("importedBanner")(importedAll.length) + "</p></div>";
    b += '<div class="banner" id="smtpBox" style="background:var(--info-bg);color:var(--navy)"><p id="smtpMsg">' + t("smtpIdle") + '</p><button class="line" id="smtpBtn">' + t("smtpTest") + "</button></div>";
    var subOk = sum("submit_ok"), recP = period.filter(function (l) { return l.source === "site"; }).length;
    if (subOk > recP) b += '<div class="banner warn"><p>' + t("mismatch")(subOk, recP) + "</p></div>";
    $("banners").innerHTML = b;
    if ($("resendFailed")) $("resendFailed").addEventListener("click", function () { resend(failedAll.map(function (l) { return l.id; }), this); });
    $("smtpBtn").addEventListener("click", function () {
      var btn = this; btn.disabled = true; $("smtpMsg").textContent = t("smtpTesting");
      api("POST", { action: "smtp" }).then(function (j) {
        $("smtpBox").style.background = j.ok ? "var(--ok-bg)" : "var(--bad-bg)"; $("smtpBox").style.color = j.ok ? "var(--ok)" : "var(--bad)";
        $("smtpMsg").innerHTML = j.ok ? t("smtpOk") : t("smtpBad") + esc(String(j.error).replace(/\.+$/, "")) + t("smtpFix");
      }).catch(function (e) { $("smtpMsg").textContent = t("error") + e.message; }).finally(function () { btn.disabled = false; });
    });

    var pv = sum("pv"), cta = sum("cta"), fs = sum("form_start"), so = sum("submit_ok");
    var pct = function (a) { return pv ? (a / pv * 100).toFixed(1).replace(".", LANG === "pt" ? "," : ".") + t("ofVisits") : ""; };
    var k = [
      [t("kVisits"), pv, "PT " + sum("pv", "pt") + " · EN " + sum("pv", "en")],
      [t("kCta"), cta, "PT " + sum("cta", "pt") + " · EN " + sum("cta", "en")],
      [t("kStart"), fs, pct(fs)],
      [t("kSent"), so, pct(so)],
      [t("kInm"), sentP, t("inPeriod")],
      [t("kFail"), failedP, failedP ? t("seeBelow") : t("none"), failedP > 0]
    ];
    $("kpis").innerHTML = k.map(function (x) { return '<div class="kpi' + (x[3] ? " bad" : "") + '"><div class="l">' + esc(x[0]) + '</div><div class="v">' + x[1] + '</div><div class="s">' + esc(x[2]) + "</div></div>"; }).join("");
    $("updated").textContent = t("updated") + fmt(data.now) + ".";

    renderLeads();

    $("daily").innerHTML = data.events.map(function (d) {
      var one = [d], L = leads.filter(function (l) { return day(l.created_at) === d.day; });
      return "<tr><td>" + d.day.split("-").reverse().join("/") + "</td>" + [sum("pv", 0, 0, one), sum("cta", 0, 0, one), sum("form_start", 0, 0, one), sum("submit_ok", 0, 0, one), sum("thanks", 0, 0, one),
        L.filter(function (l) { return l.source === "site"; }).length, L.filter(function (l) { return l.status === "failed"; }).length].map(function (v) { return '<td class="num">' + v + "</td>"; }).join("") + "</tr>";
    }).join("");

    function block(title, rows) {
      var max = Math.max.apply(null, rows.map(function (r) { return r[1]; }).concat([1]));
      return '<div class="card"><h3>' + esc(title) + "</h3><table><tbody>" + rows.map(function (r) { return "<tr><td>" + esc(r[0]) + '</td><td class="num"><span class="spark" style="width:' + Math.round(r[1] / max * 56) + 'px"></span>' + r[1] + "</td></tr>"; }).join("") + "</tbody></table></div>";
    }
    var ev = function (e, labels) { return labels.map(function (x) { return [x[1], sum(e, 0, x[0])]; }); };
    var T = [["T0", "T0 · " + t("studio")], ["T1", "T1 · Duplex"], ["T2", "T2 · Duplex"], ["T3", "T3 · Duplex"]];
    $("breakdown").innerHTML =
      block(t("bWhere"), ev("cta", [["header", t("wHeader")], ["menu", t("wMenu")], ["hero", t("wHero")], ["T0", t("wTab") + "T0"], ["T1", t("wTab") + "T1"], ["T2", t("wTab") + "T2"], ["T3", t("wTab") + "T3"]])) +
      block(t("bTabs"), ev("tab", T)) +
      block(t("bPlans"), ev("plan", T)) +
      block(t("bByType"), ev("submit_ok", T)) +
      block(t("bOther"), [[t("oGallery"), sum("gallery")], [t("oTel"), sum("tel")], [t("oLang"), sum("lang")], [t("oPhone"), sum("phone_invalid")], [t("oErr"), sum("submit_err")]]) +
      block(t("bSource"), ev("pv", [["google", t("sGoogle")], ["ext", t("sExt")], ["direct", t("sDirect")]]));
  }

  var LF = { campaign: "", utm_source: "", utm_medium: "", utm_campaign: "", utm_content: "", utm_term: "", typology: "", language: "" };
  var EMPTY = "\u0000";
  function leadVal(l, k) { return String((l.data || {})[k] || ""); }
  function filteredLeads(skipKey) {
    var from = $("lfFrom").value, to = $("lfTo").value;
    return data.leads.filter(function (l) {
      if (filter !== "all" && l.status !== filter) return false;
      var d = day(l.created_at);
      if (from && d < from) return false;
      if (to && d > to) return false;
      for (var k in LF) {
        if (k === skipKey || !LF[k]) continue;
        var v = leadVal(l, k);
        if (LF[k] === EMPTY ? v !== "" : v !== LF[k]) return false;
      }
      return true;
    });
  }
  function fillSelects() {
    document.querySelectorAll("#lfilters select").forEach(function (sel) {
      var k = sel.getAttribute("data-k"), counts = {};
      filteredLeads(k).forEach(function (l) { var v = leadVal(l, k); counts[v] = (counts[v] || 0) + 1; });
      var keys = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b); });
      if (LF[k] && !(LF[k] === EMPTY ? "" in counts : LF[k] in counts)) keys.push(LF[k] === EMPTY ? "" : LF[k]);
      sel.innerHTML = '<option value="">' + t("any") + "</option>" + keys.map(function (v) {
        var val = v === "" ? EMPTY : v;
        return '<option value="' + esc(val) + '"' + (LF[k] === val ? " selected" : "") + ">" + esc(v === "" ? t("empty") : (k === "language" ? v.toUpperCase() : v)) + " (" + (counts[v] || 0) + ")</option>";
      }).join("");
    });
  }

  function renderLeads() {
    fillSelects();
    var rows = filteredLeads();
    var st = { sent: 0, failed: 0, imported: 0 };
    rows.forEach(function (l) { st[l.status] = (st[l.status] || 0) + 1; });
    $("lcN").textContent = rows.length;
    $("lcTxt").textContent = t("leadsWord")(rows.length) + " · " + t("sent") + " " + st.sent + " · " + t("failed") + " " + st.failed + " · " + t("imported") + " " + st.imported;
    var cell = function (v) { return "<td>" + (v ? esc(v) : '<span class="muted">—</span>') + "</td>"; };
    $("leads").innerHTML = rows.length ? rows.map(function (l) {
      var d = l.data || {}, s2 = l.status, can = s2 !== "sent";
      var badge = s2 === "sent" ? '<span class="badge b-sent">' + t("sent") + "</span>" : s2 === "failed" ? '<span class="badge b-failed">' + t("failed") + "</span>" : '<span class="badge b-imported">' + t("imported") + "</span>";
      return "<tr><td>" + (can ? '<input type="checkbox" data-id="' + esc(l.id) + '"' + (selected[l.id] ? " checked" : "") + ' aria-label="' + t("select") + '">' : "") + "</td><td>" + esc(fmt(l.created_at)) + "</td><td>" + esc(d.name) + "</td><td>" + esc(d.email) + '<br><span class="muted small">' + esc(d.phone) + "</span></td><td>" + esc(d.typology) + "</td><td>" + esc((d.language || "").toUpperCase()) + "</td>" +
        cell(d.campaign) + cell(d.utm_source) + cell(d.utm_medium) + cell(d.utm_campaign) + cell(d.utm_content) + cell(d.utm_term) +
        "<td>" + badge + (s2 === "failed" ? '<span class="errtxt">' + esc(l.error) + "</span>" : "") + "</td><td>" + (can ? '<button class="line small" data-resend="' + esc(l.id) + '">' + t("resend") + "</button>" : "") + "</td></tr>";
    }).join("") : '<tr><td colspan="14" class="muted">' + t("noLeads") + t("inFilter") + ".</td></tr>";
    updateSel();
  }

  $("lfilters").addEventListener("change", function (e) {
    var k = e.target.getAttribute("data-k"); if (k) LF[k] = e.target.value;
    renderLeads();
  });
  $("lfClear").addEventListener("click", function () {
    for (var k in LF) LF[k] = ""; $("lfFrom").value = ""; $("lfTo").value = ""; filter = "all";
    document.querySelectorAll("#filters button").forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-f") === "all" ? "true" : "false"); });
    renderLeads();
  });
  $("lfCsv").addEventListener("click", function () {
    var cols = ["created_at", "name", "email", "phone", "typology", "property_ref", "language", "origin", "location", "source", "campaign", "utm_source", "utm_medium", "utm_campaign", "utm_content", "utm_term", "within_budget", "move_in_timing", "status", "error"];
    var q = function (v) { v = String(v == null ? "" : v); return /[",\n;]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var lines = [cols.join(",")].concat(filteredLeads().map(function (l) {
      var d = l.data || {};
      return cols.map(function (c) { return q(c === "created_at" ? fmt(l.created_at) : c === "status" ? l.status : c === "error" ? l.error : d[c]); }).join(",");
    }));
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" }));
    a.download = "leads-marques-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
  });

  function updateSel() { var n = Object.keys(selected).length; $("resendSel").disabled = !n; $("resendSel").textContent = t("resendSel") + (n ? " (" + n + ")" : ""); }

  $("filters").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return; filter = b.getAttribute("data-f");
    this.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); }); renderLeads();
  });
  $("leads").addEventListener("change", function (e) { var id = e.target.getAttribute("data-id"); if (!id) return; if (e.target.checked) selected[id] = 1; else delete selected[id]; updateSel(); });
  $("all").addEventListener("change", function () { var on = this.checked; $("leads").querySelectorAll("input[data-id]").forEach(function (c) { c.checked = on; if (on) selected[c.getAttribute("data-id")] = 1; else delete selected[c.getAttribute("data-id")]; }); updateSel(); });
  $("leads").addEventListener("click", function (e) { var b = e.target.closest("button[data-resend]"); if (b) resend([b.getAttribute("data-resend")], b); });
  $("resendSel").addEventListener("click", function () { resend(Object.keys(selected), this); });

  function resend(ids, btn) {
    if (!ids.length) return;
    var label = btn.textContent, done = 0, ok = 0, fail = 0, lastErr = "";
    btn.disabled = true;
    var chunks = []; for (var i = 0; i < ids.length; i += 5) chunks.push(ids.slice(i, i + 5));
    var next = function () {
      if (!chunks.length) { btn.disabled = false; btn.textContent = label; selected = {}; alert(t("resendDone")(ok, fail, lastErr)); return load(); }
      btn.textContent = t("sending") + done + "/" + ids.length;
      api("POST", { action: "resend", ids: chunks.shift() }).then(function (j) {
        j.results.forEach(function (r) { done++; if (r.status === "sent") ok++; else { fail++; lastErr = r.error || r.status; } });
        if (fail && !ok) chunks = []; // se tudo falha (ex.: senha do Gmail), não insistir
        next();
      }).catch(function (e) { btn.disabled = false; btn.textContent = label; alert(t("error") + e.message); });
    };
    next();
  }

  function parseCSV(s) {
    var rows = [], row = [], f = "", q = false;
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (q) { if (c === '"') { if (s[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(f); f = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && s[i + 1] === "\n") i++; row.push(f); rows.push(row); row = []; f = ""; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (x) { return x.trim(); }); });
  }
  $("csv").addEventListener("change", function () {
    var file = this.files[0]; if (!file) return; var input = this;
    file.text().then(function (txt) {
      var r = parseCSV(txt.replace(/^﻿/, "")); if (r.length < 2) throw new Error(t("csvEmpty"));
      var head = r[0].map(function (h) { return h.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, ""); });
      var objs = r.slice(1).map(function (cols) {
        var o = {}; head.forEach(function (h, i) { o[h] = (cols[i] || "").trim(); });
        if (!o.created_at) { var k = head.find(function (h) { return /created|date|data/.test(h); }); if (k) o.created_at = o[k]; }
        if (o.created_at && !isNaN(Date.parse(o.created_at))) o.created_at = new Date(o.created_at).toISOString();
        return o;
      }).filter(function (o) { return o.name || o.email; });
      if (!objs.length) throw new Error(t("csvCols"));
      if (!confirm(t("csvConfirm")(objs.length))) return;
      var added = 0, skipped = 0, chunks = []; for (var i = 0; i < objs.length; i += 50) chunks.push(objs.slice(i, i + 50));
      return chunks.reduce(function (p, c) { return p.then(function () { return api("POST", { action: "import", rows: c }).then(function (j) { added += j.added; skipped += j.skipped; }); }); }, Promise.resolve())
        .then(function () { alert(t("csvDone")(added, skipped)); filter = "imported"; document.querySelectorAll("#filters button").forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-f") === "imported" ? "true" : "false"); }); return load(); });
    }).catch(function (e) { alert(t("csvErr") + e.message); }).finally(function () { input.value = ""; });
  });

  applyLang();
  if (KEY) load(); else showLogin("");
})();
</script>
</body>
</html>
